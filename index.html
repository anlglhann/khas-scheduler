<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>KHAS Scheduler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="logo">KHAS Scheduler</div>
    <button id="darkToggle" class="icon-btn">🌙</button>
  </header>

  <div class="app">
    <aside class="sidebar">
      <h3>Ders seç</h3>
      <label>Faculty</label>
<select id="facultySelect"></select>
<label>Program</label>
<select id="programSelect"></select>
<label>Course</label>
<select id="courseSelect" class="select"></select>
      <input id="courseSearch" type="text" placeholder="Ders ara (örn: CMPE140, Veri Yapıları)" />
      <div id="courseInfo" class="muted"></div>

      <h3>Section’lar</h3>
      <div id="sectionList"></div>

      <h3>Seçilenler</h3>
      <div id="chosenList"></div>

      <div class="btnrow">
        <button id="clearBtn">Temizle</button>
        <button id="saveDraftBtn">Kaydet</button>
        <button id="loadDraftBtn">Yükle</button>
        <button id="copyLinkBtn">Link</button>
      </div>

      <div id="status" class="muted"></div>
    </aside>

    <main class="main">
      <h2 class="title">Takvim</h2>
      <div id="calendar" class="calendar"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
